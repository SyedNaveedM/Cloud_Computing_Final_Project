spring:
  application:
    name: controller
  datasource:
    url: jdbc:h2:file:${OBJECTSTORE_DB_PATH:./data/objectstore};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8081

objectstore:
  maintenance:
    enabled: ${OBJECTSTORE_MAINTENANCE_ENABLED:false}
